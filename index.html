<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f2">
  <meta name="description" content="Удобное расписание студентов Иркутского энергетического колледжа — группы, преподаватели и пары.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ИЭК Раписание">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ИЭК Раписание</title>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5Z"/><path d="M6.5 11v5.5c3 2 8 2 11 0V11M21 9v6"/></svg>
        </span>
        <strong>ИЭК Раписание</strong>
      </div>
    </header>
    <nav class="bottom-nav is-hidden" id="bottom-nav" aria-label="Основные разделы">
      <button type="button" class="nav-button is-current" data-page="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18M8 15h2m4 0h2" stroke-linecap="round"/></svg>
        <span data-i18n="Главная">Главная</span>
      </button>
      <button type="button" class="nav-button" data-page="teachers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5.5 20v-1.5a6.5 6.5 0 0 1 13 0V20" stroke-linecap="round"/></svg>
        <span data-i18n="Преподаватели">Преподаватели</span>
      </button>
      <button type="button" class="nav-button" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h3m5 0h8M4 17h9m5 0h2" stroke-linecap="round"/><circle cx="9.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></svg>
        <span data-i18n="Настройки">Настройки</span>
      </button>
    </nav>
    <div class="workspace">
      <div class="workspace-bar">
        <div class="sync-line" id="sync-status" role="status"><i aria-hidden="true"></i><span>Получаем данные расписания…</span></div>
        <button class="header-refresh" id="refresh" type="button" title="Проверить обновления">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v5h-5M4 19v-5h5"/><path d="M5 9a7.5 7.5 0 0 1 12.5-2L20 10M4 14l2.5 3a7.5 7.5 0 0 0 12.5-2"/></svg>
          <span data-i18n="Обновить">Обновить</span>
        </button>
      </div>
      <main id="app" class="main" tabindex="-1">
        <div class="initial-loader" role="status"><div class="loader-ring"></div><span data-i18n="Загружаем расписание…">Загружаем расписание…</span></div>
      </main>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
